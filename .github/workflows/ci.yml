name: CI

# 为什么要有这条：上一轮审计发现"测试其实没在跑"这件事在本仓库里没有任何信号
# —— `swift test` 曾经静默崩在第 4 个用例上，而退出码仍被管道吃掉，
# 文档里还写着"测试全绿"。所以这个 workflow 的重点不是"跑一下测试"，
# 而是把**执行到的用例数**变成一个只准涨、不准跌的闸。
#
# 注意：本文件只是把闸放进仓库，真正生效需要把它推到 GitHub（本轮没有 push）。
# 工具链下限 Swift 6.0（Package.swift 的 swift-tools-version 与 6 语言模式），
# 因此固定在 macos-15 runner 上；第一步会打印实际工具链版本，方便日后排查。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build (must be warning-free)
        working-directory: ClipboardHistory
        run: |
          set -o pipefail
          # R59 / BACKLOG 87：这里必须带 `--build-tests`。之前只 `swift build` ⇒ 编译的是
          # `Sources/`，**测试目标里的告警从来没进过这条闸门**：R58 提交的那条
          # `variable 'a' was never mutated` 在 `swift test` 的输出里明明白白，两次 CI 都是绿的。
          # 台账与 AGENTS.md 写的都是"构建 0 告警"，读的人会以为整个包 0 告警。
          swift build --build-tests 2>&1 | tee /tmp/build.log
          # 告警计数：干净构建应为 0。这里用 grep -c 而不是依赖退出码，
          # 因为 swift build 不会因为告警而失败。
          warnings=$(grep -c 'warning:' /tmp/build.log || true)
          echo "compile warnings: $warnings"
          # 红了要能读（R59 同一课，见 BACKLOG 86）：只报一个数字的话，下一次还得重跑构建才知道是哪条。
          grep 'warning:' /tmp/build.log | head -12 || true
          test "$warnings" = "0"

      - name: Swift tests (executed-count gate)
        working-directory: ClipboardHistory
        run: |
          set -o pipefail
          # 先落一份原始日志，再把 colorspace 那一族噪声从**进 CI 日志的那一路**里删掉。
          # 为什么这一行值得存在：无头 runner 上每绘制一次图片，AppKit 就往 stderr 打一条
          # `Unknown number of components for colorspace model -1`。实测一次 `swift test`
          # 的日志里 **23433 / 24054 行（97.4%）都是这一句**，于是 job 日志大到下载不下来 ——
          # `gh api .../jobs/<id>/logs` 三次都断在第 1~1.5 分钟，后面几步（包括唯一的
          # 动效像素闸）的正文根本够不着。上一版我按 `Unrecognized colorspace number` 过滤，
          # 那是**同族的另一句**（本机上只出现 1 次），所以日志几乎没变小 —— 按现象猜词不行，
          # 要按实测占比选词：这里按 `colorspace` 整族删。
          # 用 `sed /…/d` 而不是 `grep -v`：后者在"所有行都被过滤掉"时返回 1，
          # 而 `set -o pipefail` + `bash -e` 会让整步当场中止，`PIPESTATUS` 那一行根本轮不到跑。
          swift test 2>&1 | tee /tmp/test-raw.log | sed '/colorspace/d' | tee /tmp/test.log
          status=${PIPESTATUS[0]}
          echo "swift test exit: $status"
          echo "dropped-noise-lines: $(( $(wc -l < /tmp/test-raw.log) - $(wc -l < /tmp/test.log) ))"
          test "$status" = "0"
          executed=$(grep -oE 'Executed [0-9]+ tests' /tmp/test.log | tail -1 | grep -oE '[0-9]+')
          echo "executed cases: $executed"
          test -n "$executed"
          # 只准涨不准跌：数字掉下来意味着有用例不再被执行（被删、被 skip、编译没链进去）
          test "$executed" -ge 200 || { echo "执行到的用例数 $executed 低于下限 200"; exit 1; }

      # 第三轮审计 D-7：`UIInteractionProbeTests` / `UICaptureTests` 要环境变量才启用，
      # 而它们恰恰是"焦点链、行手势、右键菜单、帧基线"的验收手段 —— 以前 CI 一次也没跑过。
      # 先以"允许失败 + 记录数字"起步：无头 runner 上在屏窗口的稳定性未证明，
      # 拿它当硬门只会让人学会无视红色。稳定后再摘掉 continue-on-error。
      # 刻意拆成两步（而不是一个 `A|B` 的 filter）：挂住时日志要能指名是哪一类跑不动，
      # 否则"CI 的 UI 步骤红了"这句话对下一次判断没有任何用处。
      #
      # R36（BACKLOG 49 / U-59）把"红色由谁判"换了个位置：**这一步仍然 report-only，
      # 但红不再被吞** —— 它的红交给下一步 `Capture gate` 去判，而那一步是硬门。
      # 为什么留 `continue-on-error` 在这而不是那里：`swift test` 的退出码只说"有东西红了"，
      # 而这一步要的是"红了的是谁、有没有名字"。把两件事都压在一个退出码上，
      # 就会退回"要么全吞、要么因为环境的原因红"那两种已经各栽过一次的状态。
      # 台账：run 38473962277 里这一步有 **4 条断言行红**（属于 1 个用例），全部被吞。
      - name: Offscreen frame capture (report-only, gated below)
        continue-on-error: true
        timeout-minutes: 8
        working-directory: ClipboardHistory
        run: |
          set -o pipefail
          # `|| true` 是必需的：`swift test` 非零（例如某帧被"捕获失效"闸门锁住）不该让
          # 后面的汇报行整段不执行 —— 那等于这一步又变成"红了但没有数字"。
          CLIPBOARD_HISTORY_UI_SHOTS=/tmp/shots-ci \
            swift test --filter UICaptureTests 2>&1 | tee /tmp/frames-raw.log | sed '/colorspace/d' | tee /tmp/frames.log || true
          frames=$(find /tmp/shots-ci -name '*.png' 2>/dev/null | wc -l | tr -d ' ' || true)
          # 每一条抽取都必须自己吞掉非零：`bash -e` + `set -o pipefail` 下，
          # **汇报行自己的 grep 失手**也会中止脚本（实测 run 38062956819：runner 上 XCTest 只打了
          # "Executed 1 test"，单数，于是匹配 'tests' 的 grep 返回 1，captured frames 那行根本没打出来，
          # 这一步又退回"红了但没有数字"）。被测命令的 || true 挡不住这一层。
          executed=$(grep -oE 'Executed [0-9]+ tests?' /tmp/frames.log | tail -1 | grep -oE '[0-9]+' || true)
          undrawn=$(grep -c '未被绘制，判定为捕获失效' /tmp/frames.log || true)
          echo "captured frames: ${frames:-0}  executed: ${executed:-0}  捕获失效帧: ${undrawn:-0}"
          # 实测（run 38050990090）：macos-15 的 runner 上 `content-wide-1100x800` 亮暗两帧
          # 有 95% 像素未被绘制 —— 那是**捕获失效闸门**正常工作（它拒绝把空帧当验收证据），
          # 不是产品被判红。所以这里只把条数报出来，不当失败；真机上这两帧是好的。
          # R36 补：这一族的逐帧读数现在同时是 `CaptureCapability` 三条前提的输入，
          # "整族画不出来"由测试自己登记成 `CAPTURE_NOT_RUN`，不再靠这一行注释替它决定。
          test "${executed:-0}" -ge 1
          test "${frames:-0}" -ge 60

      # R36 / BACKLOG 49 / U-59：**这一步是硬门**，判的是"有没有没被登记的红色"。
      # 三条规矩：① 日志里一条 `Test Case` 结论都没有 ⇒ 红（挂死、崩溃、filter 打错，
      # 以前这些都长得像"这一步绿了"）；② 任何 `error: -[类 方法]` 或 `failed` 结论 ⇒ 红，
      # 指名是谁；③ 判出绿的用例数低于 15 ⇒ 红 —— 这是防另一种"红了没人看"：
      # 把像素判据整批改成 `throw XCTSkip` 之后，① ② 都是绿的，而那一步其实已经什么都不判了
      # （run 38473962277 实测：28 个用例里 8 个是 skipped，而报表上只有"绿"）。
      # 15 的来历：那一次是 19 passed / 8 skipped / 1 failed；红修完 ⇒ 20 passed。
      # 门取 15 而不是 20：允许个别的、已登记的降级，但不允许"整批退回 skip"。
      # 已登记的 `*_NOT_RUN` 会被逐条打出来（有读数、有原因），它们不算红。
      - name: Capture gate (unregistered reds must be zero)
        timeout-minutes: 2
        run: |
          python3 scripts/ci_capture_gate.py /tmp/frames.log --min-passed 15

      - name: On-screen interaction probes (report-only)
        continue-on-error: true
        timeout-minutes: 8
        working-directory: ClipboardHistory
        run: |
          set -o pipefail
          # 实测（同一 run）：这一类探针在 runner 上**会挂死**（8 分钟被 GitHub 掐掉，什么数字都不留）。
          # 挂死和"跑得很慢"必须区分开，而且不能靠 GitHub 的步骤超时来兜 —— 那样日志里连部分结果都没有。
          # 所以自己带一个 240 秒的看门狗：到点按 PID 收掉，然后照常汇报"跑到哪儿了"。
          CLIPBOARD_HISTORY_UI_INTERACTION=1 CLIPBOARD_HISTORY_UI_SHOTS=/tmp/shots-ci \
            swift test --filter UIInteractionProbeTests > /tmp/ui.log 2>&1 &
          pid=$!
          ( sleep 240; kill -9 "$pid" 2>/dev/null ) &
          killer=$!
          # `&& ... || ...` 而不是 `wait "$pid"; status=$?`：
          # bash -e 下 `wait` 拿到 137 会**当场中止脚本**，后面的汇报行一行都不会跑
          # （实测 run 38051846033 就是这个形状：看门狗正常收掉了进程，日志里却没有结论行）。
          wait "$pid" && status=0 || status=$?
          # `|| true` 不是装饰：看门狗到点执行完 kill 之后**自己就退出了**，
          # 于是这里的 `kill "$killer"` 报 "No such process" 返回 1 —— `bash -e` 当场中止，
          # 下面三行抽取和结论行一行都轮不到（实测 run 38064293655 就是这个形状：
          # 只有 `line 13: Killed: 9` 和 `exit code 1`，没有 `ui suite exit:`）。
          kill "$killer" 2>/dev/null || true
          # 同上：抽取行必须自己 `|| true`，否则"没跑完"这条分支永远走不到（脚本在这行就中止了），
          # 而那恰好是这段代码存在的理由。单数 "Executed 1 test" 也要能匹配。
          executed=$(grep -oE 'Executed [0-9]+ tests?' /tmp/ui.log | tail -1 | grep -oE '[0-9]+' || true)
          skipped=$(grep -oE 'with [0-9]+ tests? skipped' /tmp/ui.log | tail -1 | grep -oE '[0-9]+' || true)
          done_count=$(grep -cE "Test Case .*(passed|failed|skipped)" /tmp/ui.log || true)
          echo "ui suite exit: $status  executed: ${executed:-0}  skipped: ${skipped:-?}  已下结论的用例: $done_count"
          if [ -z "$executed" ]; then
            echo "没有跑完（看门狗在 240s 收掉了进程）：在屏探针在无头 runner 上不可用，记成 R3-D9 的已知边界"
            exit 0
          fi
          # 跑完了才谈产品结论；退出码原样报出来，但不挡发布（报告型）。
          exit "$status"

      # R62 / BACKLOG 92：上面那一步"整卷没跑完"是真的，但它顺手让**所有**在屏判据变成了免检牌。
      # R61 修侧栏「跟随选中揭示」的三条行为判据就住在那一卷里 ⇒ 61 的回归在 CI 上一条都没跑，
      # 而作业是绿的、那句解释也仍然成立。这一步把"缺席"变成逐条点名 + 一条必须登记的清单：
      # 新加一条在屏判据而不回答"runner 跑得了吗、跑不了为什么"，这里就红。
      # 与上面那步的区别是刻意的：探针本身是报告型（它不该挡发布），**登记**是硬门（它只判形状）。
      - name: On-screen probe coverage floor
        working-directory: .
        run: |
          set -o pipefail
          python3 scripts/probe_coverage_gate.py /tmp/ui.log \
            --expectations scripts/probe_coverage_expectations.json \
            --source ClipboardHistory/Tests/ClipboardHistoryAppTests/UIInteractionProbeTests.swift \
            | tee /tmp/probe-floor.log

      # 动效审计 MC-8：这道像素闸以前**只在作者本机跑过一次**，而测试文件的注释写着
      # "CI 也取过数" —— 那是注释替事实背书。这一步把它真的接上 CI。
      # 形状全部沿用上面两步踩过的坑：报告型（不挡发布）、自带看门狗（挂死必须留数字）、
      # 每条抽取行自己吞掉非零（`bash -e` + `pipefail` 下汇报行失手会把整步中止）。
      #
      # 为什么不是硬门：无头 runner 上 SwiftUI 内容根本不被绘制（上面实测 95% 空白），
      # 像素判据在那里必然拿不到帧。**环境给不出证据 ≠ 产品没有动效**，
      # 所以这一版先把"有人跑、有数字、退出码被报出来"落下来；
      # 抓帧驱动已经从 CADisplayLink 换成自旋时钟（不依赖屏幕在刷新），
      # runner 上能不能真的出帧，以这一步第一次运行的日志为准，不预设。
      - name: Motion filmstrip (report-only)
        continue-on-error: true
        timeout-minutes: 6
        working-directory: ClipboardHistory
        run: |
          set -o pipefail
          CLIPBOARD_HISTORY_UI_MOTION=1 CLIPBOARD_HISTORY_MOTION_OUT=/tmp/motion-ci \
            swift test --filter MotionFilmstripTests > /tmp/motion.log 2>&1 &
          pid=$!
          ( sleep 200; kill -9 "$pid" 2>/dev/null ) &
          killer=$!
          wait "$pid" && status=0 || status=$?
          kill "$killer" 2>/dev/null || true
          # R56 / BACKLOG 79：**stdout 会整次或大部分消失**。三种现场都见过：
          #   · CI run 38543090198 —— 测试全过、9 张胶片写出来了、`print` 的读数一行不剩；
          #   · 本机 18:58 那次 —— 同样 0 行；
          #   · 本机 19:37 那次（加完文件通道之后的第一遍）—— stdout 只剩 2 行，而文件通道有 56 行。
          # 第三种最阴：结论行活着，理由行死了 ⇒ 地板会红在 REASONLESS 上，
          # 那是一条"看起来像产品坏了"的假红。所以这里不是"缺了才补"，而是**每次取并集**：
          # 两条通道的读数都并进同一份日志。
          # 为什么是并集而不是"以文件为准"（本轮先写成后者，改回来了）：
          # 文件也可能只写了一半（进程中途死掉），那时 stdout 里活着的行是**唯一**的证据；
          # 用"换掉"就会把好数据扔掉。重复则无害 —— 地板取第一条 MOTION_SUMMARY、
          # 取最后一条结论行、理由按行收集，同一行出现两次不改变任何判定。
          # stderr 侧（`Executed N tests`、红的用例名）只有 XCTest 会打，原样保留 ——
          # 地板需要那个 executed 数才能区分"没跑完"与"验得不够"。
          readings=/tmp/motion-ci/motion-readings.log
          if [ -s "$readings" ]; then
            from_stdout=$(grep -c '^MOTION_' /tmp/motion.log || true)
            cat "$readings" >> /tmp/motion.log
            echo "MOTION_CHANNEL_UNIONED=1 stdout=$from_stdout 文件=$(wc -l < "$readings" | tr -d ' ')"
          else
            echo "MOTION_READINGS_FILE_ABSENT=1 只剩 stdout 这一条通道（文件通道没写出来）"
          fi
          summary=$(grep -m1 'MOTION_SUMMARY' /tmp/motion.log || true)
          # 绿不等于"验到了"：R2 之后每条过渡判据都会报"这次到底判了几条、哪几条是 not-run"。
          # 少了这一行，一次"3/3 全绿"和一次"1/3 有内容"在 CI 上长得一模一样。
          resolve=$(grep -m1 'MOTION_RESOLVE_SUMMARY' /tmp/motion.log || true)
          executed=$(grep -oE 'Executed [0-9]+ tests?' /tmp/motion.log | tail -1 | grep -oE '[0-9]+' || true)
          strips=$(find /tmp/motion-ci -name '*-strip.png' 2>/dev/null | wc -l | tr -d ' ' || true)
          echo "motion suite exit: $status  executed: ${executed:-0}  胶片: ${strips:-0}  ${summary:-无 MOTION_SUMMARY}  ${resolve:-无 MOTION_RESOLVE_SUMMARY（旧版判据：不知道今天判了几条）}"
          # 红要能读：**只有退出码的红等于没有红**。这一步是报告型，如果它只留下
          # "motion suite exit: 1"，下一次没人知道是哪条判据红、读数是多少（本轮 run 38256846956
          # 就是这个形状：exit 1 / executed 12，日志里一个数字都没有）。
          # 所以固定把两样东西打出来：① 各条判据自己的读数；② 红的那几条的名字。
          # `|| true` 是必需的：grep 没匹配就是 1，而 run 默认 `bash -e`（同一步里已经栽过三次）。
          echo "---- 动效读数 ----"
          # R58 / BACKLOG 83：这里原来是一份**硬编码前缀白名单**
          # （SUMMARY|RESOLVE_SUMMARY|NATIVE|SHIMMER|…）。它的问题是"每一轮新增的读数族都不在里面"：
          # R55 的 MOTION_GRAB 与 R57 的 MOTION_BAND 都没进过这份列表，
          # 于是 run 38570965657 里"runner 上带捕获到底成没成功"这件事**在日志里没有答案** ——
          # 只有 `judged=4/4`，而 4/4 在带捕获之前也是 4/4（R56），两个形状分不开。
          # 白名单会随每一轮变旧；"这一共打了多少行"不会。所以改成：先报计数，再全打。
          echo "MOTION_LINES=$(grep -cE '^MOTION_' /tmp/motion.log || true)"
          grep -E "^MOTION_" /tmp/motion.log | head -120 || true
          # R46：**not-run 的理由单独打，且不截断**。上面那个 `head -24` 是 R44 那次
          # "掉了一臂却查不到为什么"的直接成因 —— 理由行排在一大堆读数之后，被挤出了控制台，
          # 于是 run 38514753036 里 `not-run=notice-banner-dismiss` 在日志上找不到任何解释。
          # 闸门（下一步）读的是文件，不受这里影响；这一步负责让人**看见**。
          echo "---- not-run 的理由（全量，不截断） ----"
          grep -E "MOTION_NOT_RUN=" /tmp/motion.log || true
          echo "---- 红的用例 ----"
          # 两级过滤而不是一个 ERE：macOS 的 BSD grep 里 `]`（以及 `\]`）在 ERE 中不可靠 ——
          # `test[A-Za-z]+'\] failed` 对着真实那行返回 0 命中，而 `grep -F "]' failed"` 命中。
          # 这条判据本身由 scripts/tests/test_ci_report_selftest.py 的 motion/failing_test_names 形状钉住。
          grep -E "Test Case " /tmp/motion.log | grep -F "]' failed" | sed -E "s/.*Tests\.//; s/ \[/\n/g" | head -12 || true
          # R59 / BACKLOG 86：**名字不够，还要那一句为什么**。
          # run 38576482491 里 `testTransitionsAreActuallyRunning` 红了 7.4s（`motion suite exit: 1`），
          # 而整步日志里只留下名字 —— XCTAssert 那句消息在 /tmp/motion.log 里，而那个文件不上传。
          # 于是"runner 上为什么红"只能靠猜；而猜出来的修法在这一族里已经错过一次（R51 那条红得不正确）。
          echo "---- 红的理由（XCTAssert 原文，最多 12 条） ----"
          grep -E "error: -\[" /tmp/motion.log | head -12 || true
          if [ -z "$executed" ]; then
            echo "MOTION_NOT_RUN=runner-did-not-finish 看门狗在 200s 收掉了进程，这条判据在 CI 上记为未覆盖"
            exit 0
          fi
          exit "$status"

      # 覆盖率下限（R7 / BACKLOG 第 11 条）。上一步是**报告型**：红了也不挡发布，
      # 于是"今天只判了 1 条"和"判了 3 条"在 CI 上长得一模一样 —— 而 R5 把判据换成时长之后，
      # 本机确实掉到了 1/3。这句话必须有一个会红的地方来说，否则 `judged=n/m` 只是装饰。
      #
      # R46（BACKLOG 66）：这一步原来是一段 shell，只问 `judged<2 ⇒ 红`。
      # run 38514753036 从 `judged=4/4 not-run=-` 退到 `judged=3/4 not-run=notice-banner-dismiss`
      # 而整步仍然绿 —— **掉了一臂没人报**，我是把三次 run 的日志拉下来人肉对比才发现的。
      # 现在判据搬进 `scripts/motion_floor_gate.py`：谁必须判到、谁可以判不到、
      # 判不到的理由允许是哪几种，全部写在 `scripts/motion_floor_expectations.json` 里，
      # 清单外的盲区 / 没有理由的 not-run / 换了新理由 / 少了一臂的键 都会红。
      # 三条前提仍缺一不可（`executed` 有值、结论行在、judged 读得出），
      # 否则会把"探针没跑完"算成"产品没验到"（D-055 那一族）—— 这一条由脚本的单测钉住。
      - name: Motion coverage floor
        run: |
          set -o pipefail
          python3 scripts/motion_floor_gate.py /tmp/motion.log \
            --expectations scripts/motion_floor_expectations.json

      - name: Release script tests
        run: |
          python3 -m unittest discover -s scripts/tests -v 2>&1 | tee /tmp/py.log
          grep -q "OK" /tmp/py.log
          executed=$(grep -oE 'Ran [0-9]+ tests' /tmp/py.log | tail -1 | grep -oE '[0-9]+')
          echo "python cases: $executed"
          test "$executed" -ge 48

      # 打包链路不产出可分发物，但必须能跑通：上一轮的缺陷正是"每一步都 || true"，
      # 于是缺键的 Info.plist 也算构建成功。这里跑脚本级校验，避免整包 universal 构建拖慢 CI。
      - name: Info.plist gate
        run: scripts/make_info_plist.sh ClipboardHistory/Resources/Info.plist /tmp/Info.plist 0.0.0-ci

      # 第三轮审计 §3 C-2 分两问，这里一一对应：
      #   硬门问的是"夹具集有没有在不改基线的情况下变小"（防的是纪律，不是像素）；
      #   报告型问的才是审计原话"和上一版比哪些帧变了"（基准 = 发布时冻结的逐版本基线）。
      # 改了界面要在同一个 commit 里跑 `scripts/frame_baseline.py update`，硬门就是这条纪律的执行器。
      - name: "Frame baseline vs working manifest (fixture-set gate)"
        timeout-minutes: 3
        run: |
          set -o pipefail
          frames=/tmp/shots-ci
          # 复用上面报告型步骤已经拍好的帧，不再拍第二次。两个理由：省一分钟；
          # 而**捕获本身在 runner 上会非零退出**（"捕获失效闸门"拒绝把 95% 空白的帧当证据），
          # GitHub 的 run 默认 shell 是 `bash -e`，所以一条"别人的失败"会直接中止我这一步 ——
          # 我第一次就是这么红的（run 38073307465：一行 stdout 都没打出来就 exit 1）。
          # 我这一步的判据是"帧名齐不齐"，不该由捕获的退出码决定。
          count=$(find "$frames" -name '*.png' 2>/dev/null | wc -l | tr -d ' ' || true)
          if [ "${count:-0}" -lt 60 ]; then
            echo "FRAME_BASELINE_SKIPPED=runner-capture-unavailable count=${count:-0}"
            exit 0
          fi
          status=0
          # 基准是**工作基线**而不是发布快照：这一门防的是"夹具/界面变了却没在同一个 commit 里
          # update 基线"。拿发布快照当硬门基准的话，每次合理的改名都得回来改 CI，
          # 而豁免列表就是这么腐烂成噪声的。
          # 无头 runner 上 content-wide 那两帧注定拍不出来（17:52 日志原文：
          # "content-wide-1100x800-light.png 有 95% 像素未被绘制，判定为捕获失效"）——
          # 那是**环境**缺席而不是夹具缺席，所以按名字赦免这两张，其余一张都不许溜走。
          python3 scripts/frame_baseline.py check "$frames" --against working \
            --allow-missing content-wide-1100x800-light.png \
            --allow-missing content-wide-1100x800-dark.png | tee /tmp/baseline.log || status=$?
          exit "$status"

      # 审计 §3 C-2 的原话问句在这里回答："和**上一版**比，哪些帧变了"。
      # 基准是发布时由 prepare_release.py 冻结的 docs/frame_baselines/vX.Y.Z.json（auto 取最新一版）。
      # 报告型而不是硬门：新版本本来就该改像素，把"改了 62 帧"挡成红色只会训练人看红不看红。
      - name: "Frame baseline vs previous release (change report, report-only)"
        continue-on-error: true
        run: |
          set -o pipefail
          status=0
          python3 scripts/frame_baseline.py compare /tmp/shots-ci | tee /tmp/baseline-compare.log || status=$?
          grep -E "FRAME_BASELINE_" /tmp/baseline-compare.log || true
          exit "$status"

      # 第三轮审计 C-4：R2-21 那道"启动闸门"是**静态**的（读反汇编看有没有 -init 桩），
      # 它能证明"没有已知的启动障碍"，不能证明"真的起得来"。这一步补运行时那一半。
      # 报告型（continue-on-error）：无头 runner 上 GUI 会话是否可用未证明，
      # 拿它当硬门只会让人学会无视红色 —— 这是 D-7 那一轮已经付过学费的教训。
      # 判定逻辑本身由 scripts/tests/test_launch_smoke.py 硬门住（上一步的 unittest 里），
      # 所以这一步红与不红都有意义：红可能是环境，但"永远绿"绝不可能是因为判据坏了。
      - name: Runtime launch smoke (report-only)
        continue-on-error: true
        timeout-minutes: 6
        run: |
          set -o pipefail
          make bundle > /tmp/bundle.log 2>&1 || { echo "打包失败"; tail -20 /tmp/bundle.log; exit 1; }
          # 隔离：数据目录与日志目录都在 /tmp，绝不写用户的 ~/Library/Application Support/时间剪史
          status=0
          python3 scripts/launch_smoke.py "时间剪史.app" --timeout 30 | tee /tmp/smoke.log || status=$?
          grep -E "SMOKE_" /tmp/smoke.log
          exit "$status"
